name: Publier les fiches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils (pandoc, LibreOffice, polices, poppler)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pandoc poppler-utils \
            libreoffice-writer-nogui libreoffice-draw-nogui \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-dejavu-core fonts-noto-core
          pip install -q pillow lxml pypdf
      - name: Générer le site
        run: |
          DOCX=$(ls word/*.docx | head -n 1)
          echo "Word utilisé : $DOCX"
          python3 build/build.py "$DOCX" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
